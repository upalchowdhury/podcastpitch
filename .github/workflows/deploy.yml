name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev

jobs:
  # ============================================================================
  # TEST & LINT
  # ============================================================================
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: cd shared && pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
        continue-on-error: true

  # ============================================================================
  # BUILD & DEPLOY
  # ============================================================================
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set environment
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
            echo "SERVICE_SUFFIX=" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "ENVIRONMENT=staging" >> $GITHUB_ENV
            echo "SERVICE_SUFFIX=-staging" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
            echo "SERVICE_SUFFIX=-dev" >> $GITHUB_ENV
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      - name: Build and push API image
        run: |
          IMAGE_TAG="${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/podcastpitch/api:${{ github.sha }}"
          docker build -f backend/Dockerfile -t $IMAGE_TAG .
          docker push $IMAGE_TAG
          echo "API_IMAGE=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Build and push Worker image
        run: |
          IMAGE_TAG="${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/podcastpitch/worker:${{ github.sha }}"
          docker build -f backend/Dockerfile.worker -t $IMAGE_TAG .
          docker push $IMAGE_TAG
          echo "WORKER_IMAGE=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Build and push Frontend image
        run: |
          IMAGE_TAG="${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/podcastpitch/frontend:${{ github.sha }}"
          docker build -f frontend/Dockerfile -t $IMAGE_TAG \
            --build-arg NEXT_PUBLIC_API_URL=https://api${{ env.SERVICE_SUFFIX }}.podcastpitch.com \
            .
          docker push $IMAGE_TAG
          echo "FRONTEND_IMAGE=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy podcast-pitch-api${{ env.SERVICE_SUFFIX }} \
            --image ${{ env.API_IMAGE }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 3001 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars "ENV=${{ env.ENVIRONMENT }}" \
            --set-secrets "DATABASE_URL=podcast-pitch-db-url-${{ env.ENVIRONMENT }}:latest" \
            --set-secrets "JWT_SECRET=podcast-pitch-jwt-secret-${{ env.ENVIRONMENT }}:latest" \
            --set-secrets "OPENAI_API_KEY=podcast-pitch-openai-key:latest" \
            --vpc-connector podcast-pitch-connector \
            --vpc-egress private-ranges-only

      - name: Deploy Worker to Cloud Run
        run: |
          gcloud run deploy podcast-pitch-worker${{ env.SERVICE_SUFFIX }} \
            --image ${{ env.WORKER_IMAGE }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --no-allow-unauthenticated \
            --port 3002 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --set-env-vars "ENV=${{ env.ENVIRONMENT }}" \
            --set-secrets "DATABASE_URL=podcast-pitch-db-url-${{ env.ENVIRONMENT }}:latest" \
            --vpc-connector podcast-pitch-connector \
            --vpc-egress private-ranges-only

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy podcast-pitch-frontend${{ env.SERVICE_SUFFIX }} \
            --image ${{ env.FRONTEND_IMAGE }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10

      - name: Output deployment URLs
        run: |
          echo "API URL: $(gcloud run services describe podcast-pitch-api${{ env.SERVICE_SUFFIX }} --region ${{ env.GCP_REGION }} --format 'value(status.url)')"
          echo "Worker URL: $(gcloud run services describe podcast-pitch-worker${{ env.SERVICE_SUFFIX }} --region ${{ env.GCP_REGION }} --format 'value(status.url)')"
          echo "Frontend URL: $(gcloud run services describe podcast-pitch-frontend${{ env.SERVICE_SUFFIX }} --region ${{ env.GCP_REGION }} --format 'value(status.url)')"
